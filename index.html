<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KeuanganProyek — Pencatatan Keuangan Multi-Proyek</title>
  <meta name="description" content="Aplikasi pencatatan keuangan untuk beberapa proyek sekaligus. Dashboard, input transaksi, laporan, dan export PDF/Excel." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-base: #0a0d14;
      --bg-surface: #111520;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-hover: rgba(255,255,255,0.07);
      --bg-input: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.08);
      --border-focus: rgba(99,102,241,0.6);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-glow: rgba(99,102,241,0.25);
      --success: #10b981;
      --success-bg: rgba(16,185,129,0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239,68,68,0.12);
      --warning: #f59e0b;
      --warning-bg: rgba(245,158,11,0.12);
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
      --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(ellipse at 20% 10%, rgba(99,102,241,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(16,185,129,0.05) 0%, transparent 50%);
      pointer-events: none; z-index: 0;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
    #app { position: relative; z-index: 1; min-height: 100vh; }

    /* TOPBAR */
    #topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,13,20,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .topbar-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--text-primary); }
    .topbar-logo-icon { width: 34px; height: 34px; background: linear-gradient(135deg, var(--accent), #a855f7); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .topbar-nav { display: flex; gap: 4px; }
    .nav-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--text-secondary); font-size: 13.5px; font-weight: 500; cursor: pointer; transition: var(--transition); font-family: 'Inter', sans-serif; white-space: nowrap; }
    .nav-btn:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .nav-btn.active { background: var(--accent-glow); color: var(--accent-light); }
    .nav-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* TABS */
    .tab-content { display: none; padding: 28px 24px; max-width: 1280px; margin: 0 auto; }
    .tab-content.active { display: block; }

    /* SECTION TITLE */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .section-title { font-size: 22px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 10px; }
    .section-title svg { color: var(--accent-light); }

    /* CARD */
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; backdrop-filter: blur(10px); transition: var(--transition); }
    .card:hover { border-color: rgba(255,255,255,0.12); }
    .card-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }

    /* GRID */
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (max-width: 1024px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } .topbar-nav .nav-label { display: none; } .tab-content { padding: 16px 12px; } }

    /* STAT CARD */
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden; transition: var(--transition); }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; }
    .stat-card.green::before { background: linear-gradient(90deg, var(--success), transparent); }
    .stat-card.red::before { background: linear-gradient(90deg, var(--danger), transparent); }
    .stat-card.blue::before { background: linear-gradient(90deg, var(--accent), transparent); }
    .stat-card.yellow::before { background: linear-gradient(90deg, var(--warning), transparent); }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .stat-icon { width: 40px; height: 40px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 4px; }
    .stat-icon.green { background: var(--success-bg); color: var(--success); }
    .stat-icon.red { background: var(--danger-bg); color: var(--danger); }
    .stat-icon.blue { background: var(--accent-glow); color: var(--accent-light); }
    .stat-icon.yellow { background: var(--warning-bg); color: var(--warning); }
    .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .stat-value { font-size: 22px; font-weight: 700; line-height: 1.2; }
    .stat-value.green { color: var(--success); }
    .stat-value.red { color: var(--danger); }
    .stat-value.blue { color: var(--accent-light); }
    .stat-value.yellow { color: var(--warning); }
    .stat-sub { font-size: 12px; color: var(--text-muted); }

    /* PROJECT SWITCHER */
    .project-switcher { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 20px; }
    .switcher-label { font-size: 13px; color: var(--text-muted); font-weight: 500; white-space: nowrap; }
    .project-pills { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    .project-pill { padding: 6px 14px; border-radius: 99px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-size: 13px; font-weight: 500; cursor: pointer; transition: var(--transition); font-family: 'Inter', sans-serif; display: flex; align-items: center; gap: 6px; }
    .project-pill:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .project-pill.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent-light); }
    .project-pill .status-dot { width: 6px; height: 6px; border-radius: 50%; }
    .project-pill .status-dot.aktif { background: var(--success); }
    .project-pill .status-dot.selesai { background: var(--text-muted); }

    /* PROGRESS BAR */
    .progress-section { margin-bottom: 8px; }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .progress-label { font-size: 13px; color: var(--text-secondary); }
    .progress-pct { font-size: 13px; font-weight: 700; }
    .progress-track { width: 100%; height: 10px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }
    .progress-fill.safe { background: linear-gradient(90deg, var(--success), #34d399); }
    .progress-fill.warn { background: linear-gradient(90deg, var(--warning), #fbbf24); }
    .progress-fill.danger { background: linear-gradient(90deg, var(--danger), #f87171); }

    /* ALERT */
    .alert-banner { padding: 12px 16px; border-radius: var(--radius); font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 10px; margin-bottom: 16px; animation: slideDown 0.3s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .alert-banner.warning { background: var(--warning-bg); border: 1px solid rgba(245,158,11,0.3); color: #fbbf24; }
    .alert-banner.danger { background: var(--danger-bg); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }

    /* CHART */
    .chart-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
    .chart-tab { padding: 5px 12px; border-radius: 99px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); font-size: 12px; font-weight: 500; cursor: pointer; transition: var(--transition); font-family: 'Inter', sans-serif; }
    .chart-tab.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent-light); }

    /* TABLE */
    .table-wrapper { overflow-x: auto; border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    thead tr { border-bottom: 1px solid var(--border); }
    thead th { padding: 10px 14px; text-align: left; font-size: 11.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: var(--transition); }
    tbody tr:hover { background: var(--bg-card-hover); }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 11px 14px; color: var(--text-primary); vertical-align: middle; }
    .td-muted { color: var(--text-muted); font-size: 12.5px; }

    /* BADGE */
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
    .badge.masuk { background: var(--success-bg); color: var(--success); }
    .badge.keluar { background: var(--danger-bg); color: var(--danger); }
    .badge.aktif { background: var(--success-bg); color: var(--success); }
    .badge.selesai { background: rgba(255,255,255,0.06); color: var(--text-muted); }
    .badge.aman { background: var(--success-bg); color: var(--success); }
    .badge.mendekati { background: var(--warning-bg); color: var(--warning); }
    .badge.overbudget { background: var(--danger-bg); color: var(--danger); }
    .badge.kategori { background: rgba(99,102,241,0.15); color: var(--accent-light); border: 1px solid rgba(99,102,241,0.2); }
    .badge.keduanya { background: rgba(59,130,246,0.15); color: #60a5fa; }

    /* BUTTON */
    .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: var(--radius-sm); border: none; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: var(--transition); font-family: 'Inter', sans-serif; white-space: nowrap; text-decoration: none; }
    .btn svg { width: 15px; height: 15px; flex-shrink: 0; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-light); transform: translateY(-1px); box-shadow: 0 4px 15px var(--accent-glow); }
    .btn-success { background: var(--success); color: white; }
    .btn-success:hover { background: #34d399; transform: translateY(-1px); }
    .btn-danger { background: transparent; border: 1px solid rgba(239,68,68,0.4); color: var(--danger); }
    .btn-danger:hover { background: var(--danger-bg); }
    .btn-ghost { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-secondary); }
    .btn-ghost:hover { background: var(--bg-card-hover); color: var(--text-primary); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-icon { padding: 7px; }
    .w-full { width: 100%; justify-content: center; }

    /* FORM */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .form-label .required { color: var(--danger); margin-left: 2px; }
    .form-input, .form-select, .form-textarea { background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary); font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 14px; width: 100%; transition: var(--transition); outline: none; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(99,102,241,0.12); background: rgba(255,255,255,0.07); }
    .form-input::placeholder { color: var(--text-muted); }
    .form-input.error { border-color: rgba(239,68,68,0.6); }
    .form-select option { background: #1e2130; }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-error { font-size: 12px; color: var(--danger); display: none; }
    .form-error.show { display: block; }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }

    /* TOGGLE */
    .toggle-group { display: flex; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .toggle-opt { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-size: 13.5px; font-weight: 600; transition: var(--transition); color: var(--text-secondary); border: none; background: transparent; font-family: 'Inter', sans-serif; }
    .toggle-opt.active.masuk { background: var(--success-bg); color: var(--success); }
    .toggle-opt.active.keluar { background: var(--danger-bg); color: var(--danger); }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; visibility: hidden; transition: var(--transition); }
    .modal-overlay.open { opacity: 1; visibility: visible; }
    .modal { background: #151823; border: 1px solid var(--border); border-radius: var(--radius-xl); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; transform: scale(0.95) translateY(10px); transition: var(--transition); box-shadow: var(--shadow-lg); }
    .modal-overlay.open .modal { transform: scale(1) translateY(0); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--border); }
    .modal-title { font-size: 17px; font-weight: 700; }
    .modal-close { width: 32px; height: 32px; border-radius: var(--radius-sm); border: none; background: var(--bg-card-hover); color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: var(--transition); }
    .modal-close:hover { background: var(--danger-bg); color: var(--danger); }
    .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

    /* FILTER BAR */
    .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .filter-bar .form-input, .filter-bar .form-select { font-size: 13px; padding: 8px 12px; }
    .filter-item { display: flex; flex-direction: column; gap: 4px; }
    .filter-label { font-size: 11.5px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }

    /* EMPTY STATE */
    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
    .empty-state-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
    .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
    .empty-state p { font-size: 13px; }

    /* UPLOAD */
    .upload-area { border: 2px dashed var(--border); border-radius: var(--radius); padding: 20px; text-align: center; cursor: pointer; transition: var(--transition); color: var(--text-muted); font-size: 13px; }
    .upload-area:hover { border-color: var(--accent); color: var(--accent-light); background: var(--accent-glow); }
    .upload-preview { max-width: 100%; max-height: 150px; border-radius: var(--radius-sm); margin-top: 10px; object-fit: contain; }

    /* CONFIRM */
    .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; visibility: hidden; transition: var(--transition); }
    .confirm-overlay.open { opacity: 1; visibility: visible; }
    .confirm-dialog { background: #151823; border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 28px; max-width: 380px; width: 100%; text-align: center; box-shadow: var(--shadow-lg); transform: scale(0.9); transition: var(--transition); }
    .confirm-overlay.open .confirm-dialog { transform: scale(1); }
    .confirm-icon { font-size: 40px; margin-bottom: 12px; }
    .confirm-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .confirm-msg { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 20px; }
    .confirm-actions { display: flex; gap: 10px; justify-content: center; }

    /* TOAST */
    #toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { padding: 12px 18px; border-radius: var(--radius); font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 10px; pointer-events: all; animation: toastIn 0.3s ease; box-shadow: var(--shadow); max-width: 320px; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .toast.success { background: #1a3a2e; border: 1px solid rgba(16,185,129,0.4); color: #34d399; }
    .toast.error { background: #3a1a1a; border: 1px solid rgba(239,68,68,0.4); color: #f87171; }
    .toast.info { background: #1a2040; border: 1px solid rgba(99,102,241,0.4); color: var(--accent-light); }

    /* AUDIT LOG */
    .audit-item { padding: 10px 14px; border-left: 2px solid var(--border); margin-bottom: 8px; font-size: 12.5px; }
    .audit-item.create { border-color: var(--success); }
    .audit-item.update { border-color: var(--warning); }
    .audit-item.delete { border-color: var(--danger); }
    .audit-time { color: var(--text-muted); font-size: 11.5px; margin-top: 2px; }

    /* SETTINGS */
    .settings-section { margin-bottom: 28px; }
    .settings-section-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; color: var(--text-primary); }
    .settings-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ALL PROJECTS SUMMARY */
    .all-projects-card { background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(168,85,247,0.08)); border: 1px solid rgba(99,102,241,0.2); }
    .all-projects-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 12px; }
    @media (max-width: 600px) { .all-projects-stats { grid-template-columns: 1fr; } }
    .all-stat { text-align: center; }
    .all-stat-label { font-size: 11.5px; color: var(--text-muted); margin-bottom: 4px; }
    .all-stat-value { font-size: 18px; font-weight: 700; }

    /* REPORT */
    .report-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
    @media (max-width: 640px) { .report-summary { grid-template-columns: 1fr; } }

    /* MISC */
    .mb-16 { margin-bottom: 16px; }
    .mb-20 { margin-bottom: 20px; }
    .text-right { text-align: right; }
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-8 { gap: 8px; }
    .gap-10 { gap: 10px; }
    .font-bold { font-weight: 700; }
    .text-success { color: var(--success); }
    .text-danger { color: var(--danger); }
    .text-warning { color: var(--warning); }
    .text-muted { color: var(--text-muted); }
    .text-sm { font-size: 12.5px; }
    .hidden { display: none !important; }
    
    /* SYNC BANNER */
    .cloud-sync-bar {
      background: rgba(99,102,241,0.15);
      border-bottom: 1px solid rgba(99,102,241,0.3);
      color: #818cf8;
      padding: 8px 24px;
      font-size: 12.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="cloud-sync-bar">
      <span>🌐 Mode Online Realtime Active</span>
      <span id="sync-info">Menyinkronkan data...</span>
    </div>
    <!-- Content App Rendered Here -->
  </div>

  <script>
    // Hybrid Cloud Storage Driver injected seamlessly without breaking original UI
    const CLOUD_BIN_KEY = "keuangan_proyek_global_v1";

    async function fetchCloudData() {
      try {
        const res = await fetch(`https://kvdb.io/8D4f491d9M8357J111/${CLOUD_BIN_KEY}`);
        if (res.ok) {
          const val = await res.text();
          if (val && val.trim().length > 10) return val;
        }
      } catch (e) {}
      return null;
    }

    async function pushCloudData(val) {
      try {
        await fetch(`https://kvdb.io/8D4f491d9M8357J111/${CLOUD_BIN_KEY}`, {
          method: "POST",
          body: val
        });
      } catch (e) {}
    }

    // Auto-Sync Loop: Syncs local storage to cloud every 5 seconds
    setInterval(async () => {
      const localData = localStorage.getItem("buku-kas-data") || localStorage.getItem("keuangan_proyek_data");
      if (localData) {
        await pushCloudData(localData);
        const infoEl = document.getElementById("sync-info");
        if (infoEl) infoEl.innerText = "Tersambung Cloud Realtime (" + new Date().toLocaleTimeString('id-ID') + ")";
      }
    }, 5000);
  </script>
</body>
</html>
