<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buku Kas Proyek — Online & Multi-Device Sync</title>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Recharts -->
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #EEF3F2; color: #1B2B34; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_CATEGORIES = [
      { id: "cat-material", name: "Material", type: "keluar" },
      { id: "cat-tenaga", name: "Tenaga kerja", type: "keluar" },
      { id: "cat-sewa", name: "Sewa alat", type: "keluar" },
      { id: "cat-transport", name: "Transportasi", type: "keluar" },
      { id: "cat-admin", name: "Administrasi", type: "keluar" },
      { id: "cat-lain-keluar", name: "Lain-lain", type: "keluar" },
      { id: "cat-termin", name: "Termin proyek", type: "masuk" },
      { id: "cat-talangan", name: "Dana talangan", type: "masuk" },
      { id: "cat-lain-masuk", name: "Lain-lain", type: "masuk" },
    ];

    const STORAGE_KEY = "buku-kas-data";
    const SESSION_KEY = "buku-kas-session";
    const uid = () => Math.random().toString(36).slice(2, 10);
    const todayISO = () => new Date().toISOString().slice(0, 10);

    const formatRupiah = (n) =>
      new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(Math.round(n || 0));

    // Hybrid Cloud Storage Driver
    const cloudStorage = {
      async get(key, userEmail) {
        const userKey = userEmail ? `${key}_${userEmail.toLowerCase().replace(/[^a-z0-9]/g, '')}` : key;
        
        // 1. First Priority: Local Storage Migration check
        const localUserVal = localStorage.getItem(userKey);
        const localLegacyVal = localStorage.getItem(key);

        // 2. Fetch from Cloud
        try {
          const res = await fetch(`https://kvdb.io/8D4f491d9M8357J111/${userKey}`);
          if (res.ok) {
            const val = await res.text();
            if (val && val.trim().length > 10) {
              const parsedCloud = JSON.parse(val);
              // Merge if local has items and cloud is empty
              if (parsedCloud && parsedCloud.transactions && parsedCloud.transactions.length > 0) {
                return { value: val };
              }
            }
          }
        } catch (e) {}

        // Fallback to local
        if (localUserVal) return { value: localUserVal };
        if (localLegacyVal) return { value: localLegacyVal };
        return null;
      },

      async set(key, value, userEmail) {
        const userKey = userEmail ? `${key}_${userEmail.toLowerCase().replace(/[^a-z0-9]/g, '')}` : key;
        try {
          localStorage.setItem(userKey, value);
          localStorage.setItem(key, value); // preserve legacy copy
        } catch (e) {}

        try {
          await fetch(`https://kvdb.io/8D4f491d9M8357J111/${userKey}`, {
            method: "POST",
            body: value
          });
        } catch (e) {}

        return true;
      }
    };

    function App() {
      const [loading, setLoading] = useState(true);
      const [data, setData] = useState({ projects: [], categories: DEFAULT_CATEGORIES, transactions: [] });
      const [selectedProjectId, setSelectedProjectId] = useState(null);
      const [currentUserEmail, setCurrentUserEmail] = useState("");
      const [emailInput, setEmailInput] = useState("");
      const [syncStatus, setSyncStatus] = useState("Online (Cloud Active)");

      // Load data bound to current email
      const loadAccountData = async (email) => {
        setLoading(true);
        try {
          const res = await cloudStorage.get(STORAGE_KEY, email);
          if (res && res.value) {
            const parsed = JSON.parse(res.value);
            const next = {
              projects: parsed.projects || [],
              categories: parsed.categories && parsed.categories.length ? parsed.categories : DEFAULT_CATEGORIES,
              transactions: parsed.transactions || [],
            };
            setData(next);
            if (next.projects.length) setSelectedProjectId(next.projects[0].id);

            // Ensure uploaded to cloud
            await cloudStorage.set(STORAGE_KEY, JSON.stringify(next), email);
          } else {
            setData({ projects: [], categories: DEFAULT_CATEGORIES, transactions: [] });
          }
        } catch (e) {
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        const savedEmail = localStorage.getItem(SESSION_KEY);
        if (savedEmail) {
          setCurrentUserEmail(savedEmail);
          loadAccountData(savedEmail);
        } else {
          setLoading(false);
        }
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        if (!emailInput.trim()) return;
        const email = emailInput.trim().toLowerCase();
        localStorage.setItem(SESSION_KEY, email);
        setCurrentUserEmail(email);
        loadAccountData(email);
      };

      const handleLogout = () => {
        localStorage.removeItem(SESSION_KEY);
        setCurrentUserEmail("");
        setData({ projects: [], categories: DEFAULT_CATEGORIES, transactions: [] });
      };

      const updateData = async (next) => {
        setData(next);
        await cloudStorage.set(STORAGE_KEY, JSON.stringify(next), currentUserEmail);
      };

      const addProject = () => {
        const name = prompt("Nama Proyek Baru:");
        if (!name) return;
        const budget = parseFloat(prompt("Anggaran Proyek (Rp):", "100000000")) || 0;
        const newProj = { id: uid(), name, budget, status: "aktif" };
        const next = { ...data, projects: [...data.projects, newProj] };
        updateData(next);
        setSelectedProjectId(newProj.id);
      };

      const addTransaction = (type) => {
        if (!selectedProjectId) return alert("Pilih proyek terlebih dahulu!");
        const amountStr = prompt("Jumlah Nominal (Rp):");
        const amount = parseFloat(amountStr);
        if (!amount || amount <= 0) return;
        const note = prompt("Keterangan Transaksi:");
        const newTx = {
          id: uid(),
          projectId: selectedProjectId,
          type,
          amount,
          note: note || "-",
          date: todayISO()
        };
        updateData({ ...data, transactions: [...data.transactions, newTx] });
      };

      const deleteTransaction = (txId) => {
        if (!window.confirm("Hapus transaksi ini?")) return;
        const nextTx = data.transactions.filter(t => t.id !== txId);
        updateData({ ...data, transactions: nextTx });
      };

      const exportBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
        const a = document.createElement("a");
        a.href = dataStr;
        a.download = `buku-kas-${currentUserEmail}-${todayISO()}.json`;
        a.click();
      };

      const selectedProject = data.projects.find(p => p.id === selectedProjectId);
      const filteredTransactions = data.transactions.filter(t => t.projectId === selectedProjectId);

      const totals = useMemo(() => {
        let masuk = 0, keluar = 0;
        filteredTransactions.forEach(t => {
          if (t.type === "masuk") masuk += t.amount; else keluar += t.amount;
        });
        return { masuk, keluar, saldo: masuk - keluar };
      }, [filteredTransactions]);

      if (!currentUserEmail) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4 bg-slate-900 text-white">
            <div className="bg-slate-800 p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-700">
              <h1 className="text-2xl font-bold mb-2 text-indigo-400">Buku Kas Proyek Online</h1>
              <p className="text-slate-400 text-sm mb-6">Masukkan email akun Anda untuk mengakses dan menyinkronkan data di semua perangkat (HP / Laptop).</p>
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1">Email / Akun Proyek</label>
                  <input
                    type="email"
                    required
                    placeholder="nama@perusahaan.com"
                    value={emailInput}
                    onChange={e => setEmailInput(e.target.value)}
                    className="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-white"
                  />
                </div>
                <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-lg text-white transition">
                  Masuk & Sinkronkan Cloud
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-12">
          {/* Topbar */}
          <div className="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
            <div>
              <h1 className="font-bold text-lg text-indigo-400">Buku Kas Proyek</h1>
              <p className="text-xs text-slate-400">Akun: <span className="text-white font-medium">{currentUserEmail}</span> • <span className="text-emerald-400">{syncStatus}</span></p>
            </div>
            <div className="flex gap-2">
              <button onClick={exportBackup} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs rounded border border-slate-700">Backup JSON</button>
              <button onClick={handleLogout} className="px-3 py-1.5 bg-red-900/40 hover:bg-red-800/60 text-red-300 text-xs rounded border border-red-800">Keluar</button>
            </div>
          </div>

          <div className="max-w-6xl mx-auto p-6 space-y-6">
            {/* Project Selector Bar */}
            <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-3 items-center justify-between">
              <div className="flex flex-wrap gap-2 items-center">
                <span className="text-xs font-semibold text-slate-500">Pilih Proyek:</span>
                {data.projects.map(p => (
                  <button
                    key={p.id}
                    onClick={() => setSelectedProjectId(p.id)}
                    className={`px-4 py-1.5 rounded-full text-sm font-medium transition ${selectedProjectId === p.id ? 'bg-indigo-600 text-white shadow' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}
                  >
                    {p.name}
                  </button>
                ))}
                {data.projects.length === 0 && <span className="text-sm text-slate-400 italic">Belum ada proyek</span>}
              </div>
              <button onClick={addProject} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow">+ Tambah Proyek</button>
            </div>

            {/* Dashboard Cards */}
            {selectedProject ? (
              <>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <p className="text-xs text-slate-500 uppercase font-semibold">Total Pemasukan</p>
                    <p className="text-2xl font-bold text-emerald-600 mt-1">{formatRupiah(totals.masuk)}</p>
                  </div>
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <p className="text-xs text-slate-500 uppercase font-semibold">Total Pengeluaran</p>
                    <p className="text-2xl font-bold text-rose-600 mt-1">{formatRupiah(totals.keluar)}</p>
                  </div>
                  <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <p className="text-xs text-slate-500 uppercase font-semibold">Sisa Saldo Kas</p>
                    <p className="text-2xl font-bold text-slate-800 mt-1">{formatRupiah(totals.saldo)}</p>
                  </div>
                </div>

                {/* Actions */}
                <div className="flex gap-3">
                  <button onClick={() => addTransaction("masuk")} className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow text-sm">+ Catat Uang Masuk</button>
                  <button onClick={() => addTransaction("keluar")} className="flex-1 py-3 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl shadow text-sm">- Catat Pengeluaran</button>
                </div>

                {/* Transaction History Table */}
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                  <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                    <h3 className="font-semibold text-slate-800">Riwayat Transaksi Realtime</h3>
                    <span className="text-xs text-slate-400">{filteredTransactions.length} Transaksi</span>
                  </div>
                  <table className="w-full text-left text-sm">
                    <thead className="bg-slate-50 text-slate-500 text-xs uppercase font-semibold">
                      <tr>
                        <th className="px-6 py-3">Tanggal</th>
                        <th className="px-6 py-3">Keterangan</th>
                        <th className="px-6 py-3">Tipe</th>
                        <th className="px-6 py-3 text-right">Nominal</th>
                        <th className="px-6 py-3 text-center">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredTransactions.map(t => (
                        <tr key={t.id} className="hover:bg-slate-50">
                          <td className="px-6 py-3.5 text-slate-500">{t.date}</td>
                          <td className="px-6 py-3.5 font-medium text-slate-800">{t.note}</td>
                          <td className="px-6 py-3.5">
                            <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${t.type === 'masuk' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                              {t.type === 'masuk' ? 'Uang Masuk' : 'Pengeluaran'}
                            </span>
                          </td>
                          <td className={`px-6 py-3.5 text-right font-semibold ${t.type === 'masuk' ? 'text-emerald-600' : 'text-rose-600'}`}>
                            {t.type === 'masuk' ? '+' : '-'}{formatRupiah(t.amount)}
                          </td>
                          <td className="px-6 py-3.5 text-center">
                            <button onClick={() => deleteTransaction(t.id)} className="text-xs text-red-500 hover:text-red-700">Hapus</button>
                          </td>
                        </tr>
                      ))}
                      {filteredTransactions.length === 0 && (
                        <tr>
                          <td colSpan="5" className="px-6 py-8 text-center text-slate-400">Belum ada transaksi di proyek ini.</td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </>
            ) : (
              <div className="bg-white p-12 rounded-xl text-center border border-slate-200 text-slate-400">
                Silakan pilih atau tambah proyek baru untuk memulai pencatatan online.
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
