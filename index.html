<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buku Kas Proyek — Online Multi-Device</title>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0a0d14; color: #f1f5f9; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const STORAGE_KEY = "keuangan_proyek_data";
    const CLOUD_URL = "https://kvdb.io/8D4f491d9M8357J111/keuangan_proyek_master_sync";

    const DEFAULT_CATEGORIES = [
      { id: "cat-material", name: "Material", type: "keluar" },
      { id: "cat-tenaga", name: "Tenaga kerja", type: "keluar" },
      { id: "cat-sewa", name: "Sewa alat", type: "keluar" },
      { id: "cat-transport", name: "Transportasi", type: "keluar" },
      { id: "cat-termin", name: "Termin proyek", type: "masuk" },
      { id: "cat-talangan", name: "Dana talangan", type: "masuk" },
    ];

    const uid = () => Math.random().toString(36).slice(2, 10);
    const todayISO = () => new Date().toISOString().slice(0, 10);
    const formatRupiah = (n) => new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(Math.round(n || 0));

    function App() {
      const [data, setData] = useState({ projects: [], categories: DEFAULT_CATEGORIES, transactions: [] });
      const [selectedProjectId, setSelectedProjectId] = useState(null);
      const [syncing, setSyncing] = useState(false);

      // 1. Automatic Cloud & Local Load
      const loadAllData = async () => {
        setSyncing(true);
        let cloudData = null;
        try {
          const res = await fetch(CLOUD_URL);
          if (res.ok) {
            const txt = await res.text();
            if (txt && txt.length > 10) cloudData = JSON.parse(txt);
          }
        } catch(e) {}

        const localTxt = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("buku-kas-data");
        let localData = null;
        if (localTxt) {
          try { localData = JSON.parse(localTxt); } catch(e) {}
        }

        // Merge Strategy: Prefer Cloud if contains transactions, else use local & upload
        let merged = { projects: [], categories: DEFAULT_CATEGORIES, transactions: [] };
        if (cloudData && cloudData.projects && cloudData.projects.length > 0) {
          merged = cloudData;
        } else if (localData && localData.projects && localData.projects.length > 0) {
          merged = localData;
          // Upload local data to cloud
          try {
            await fetch(CLOUD_URL, { method: "POST", body: JSON.stringify(merged) });
          } catch(e) {}
        }

        setData(merged);
        if (merged.projects.length) setSelectedProjectId(merged.projects[0].id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
        setSyncing(false);
      };

      useEffect(() => {
        loadAllData();
      }, []);

      const saveData = async (nextData) => {
        setData(nextData);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(nextData));
        setSyncing(true);
        try {
          await fetch(CLOUD_URL, { method: "POST", body: JSON.stringify(nextData) });
        } catch(e) {}
        setSyncing(false);
      };

      const addProject = () => {
        const name = prompt("Nama Proyek Baru:");
        if (!name) return;
        const budget = parseFloat(prompt("Anggaran Proyek (Rp):", "100000000")) || 0;
        const newP = { id: uid(), name, budget };
        const next = { ...data, projects: [...data.projects, newP] };
        saveData(next);
        setSelectedProjectId(newP.id);
      };

      const addTransaction = (type) => {
        if (!selectedProjectId) return alert("Pilih proyek dulu!");
        const amount = parseFloat(prompt("Nominal (Rp):"));
        if (!amount || amount <= 0) return;
        const note = prompt("Keterangan:");
        const newT = { id: uid(), projectId: selectedProjectId, type, amount, note: note || "-", date: todayISO() };
        saveData({ ...data, transactions: [...data.transactions, newT] });
      };

      const deleteTx = (id) => {
        if (!confirm("Hapus transaksi?")) return;
        saveData({ ...data, transactions: data.transactions.filter(t => t.id !== id) });
      };

      const exportJSON = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
        const a = document.createElement("a");
        a.href = dataStr;
        a.download = `backup-keuangan-proyek-${todayISO()}.json`;
        a.click();
      };

      const selectedProj = data.projects.find(p => p.id === selectedProjectId);
      const filteredTx = data.transactions.filter(t => t.projectId === selectedProjectId);

      const totals = useMemo(() => {
        let masuk = 0, keluar = 0;
        filteredTx.forEach(t => { if (t.type === "masuk") masuk += t.amount; else keluar += t.amount; });
        return { masuk, keluar, saldo: masuk - keluar };
      }, [filteredTx]);

      return (
        <div className="min-h-screen pb-12">
          {/* Header */}
          <div className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center">
            <div>
              <h1 className="text-xl font-bold text-indigo-400">KeuanganProyek Multi-Device</h1>
              <p className="text-xs text-slate-400">Status Sync: {syncing ? <span className="text-amber-400">Menyinkronkan...</span> : <span className="text-emerald-400">Terhubung Cloud Auto-Sync</span>}</p>
            </div>
            <div className="flex gap-2">
              <button onClick={loadAllData} className="px-3 py-1.5 bg-slate-800 text-xs rounded border border-slate-700 hover:bg-slate-700">🔄 Refresh Data</button>
              <button onClick={exportJSON} className="px-3 py-1.5 bg-slate-800 text-xs rounded border border-slate-700 hover:bg-slate-700">💾 Backup JSON</button>
            </div>
          </div>

          <div className="max-w-6xl mx-auto p-6 space-y-6">
            {/* Project Switcher */}
            <div className="bg-slate-800/60 p-4 rounded-xl border border-slate-700 flex flex-wrap justify-between items-center gap-3">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-xs font-semibold text-slate-400">Proyek:</span>
                {data.projects.map(p => (
                  <button key={p.id} onClick={() => setSelectedProjectId(p.id)} className={`px-4 py-1.5 rounded-full text-sm font-medium transition ${selectedProjectId === p.id ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}`}>{p.name}</button>
                ))}
              </div>
              <button onClick={addProject} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-lg">+ Tambah Proyek</button>
            </div>

            {selectedProj ? (
              <>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-800/80 p-5 rounded-xl border border-slate-700">
                    <p className="text-xs text-slate-400 font-semibold uppercase">Total Pemasukan</p>
                    <p className="text-2xl font-bold text-emerald-400 mt-1">{formatRupiah(totals.masuk)}</p>
                  </div>
                  <div className="bg-slate-800/80 p-5 rounded-xl border border-slate-700">
                    <p className="text-xs text-slate-400 font-semibold uppercase">Total Pengeluaran</p>
                    <p className="text-2xl font-bold text-rose-400 mt-1">{formatRupiah(totals.keluar)}</p>
                  </div>
                  <div className="bg-slate-800/80 p-5 rounded-xl border border-slate-700">
                    <p className="text-xs text-slate-400 font-semibold uppercase">Sisa Saldo Kas</p>
                    <p className="text-2xl font-bold text-slate-100 mt-1">{formatRupiah(totals.saldo)}</p>
                  </div>
                </div>

                <div className="flex gap-3">
                  <button onClick={() => addTransaction("masuk")} className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-xl text-sm">+ Catat Uang Masuk</button>
                  <button onClick={() => addTransaction("keluar")} className="flex-1 py-3 bg-rose-600 hover:bg-rose-500 font-semibold rounded-xl text-sm">- Catat Pengeluaran</button>
                </div>

                <div className="bg-slate-800/80 rounded-xl border border-slate-700 overflow-hidden">
                  <div className="px-6 py-4 border-b border-slate-700 flex justify-between items-center">
                    <h3 className="font-semibold text-slate-200">Riwayat Transaksi Realtime</h3>
                    <span className="text-xs text-slate-400">{filteredTx.length} Transaksi</span>
                  </div>
                  <table className="w-full text-left text-sm">
                    <thead className="bg-slate-900/60 text-slate-400 text-xs uppercase">
                      <tr>
                        <th className="px-6 py-3">Tanggal</th>
                        <th className="px-6 py-3">Keterangan</th>
                        <th className="px-6 py-3">Tipe</th>
                        <th className="px-6 py-3 text-right">Nominal</th>
                        <th className="px-6 py-3 text-center">Aksi</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-700/50">
                      {filteredTx.map(t => (
                        <tr key={t.id} className="hover:bg-slate-700/30">
                          <td className="px-6 py-3.5 text-slate-400">{t.date}</td>
                          <td className="px-6 py-3.5 font-medium text-slate-200">{t.note}</td>
                          <td className="px-6 py-3.5">
                            <span className={`px-2.5 py-1 rounded-full text-xs font-semibold ${t.type === 'masuk' ? 'bg-emerald-900/50 text-emerald-300' : 'bg-rose-900/50 text-rose-300'}`}>
                              {t.type === 'masuk' ? 'Uang Masuk' : 'Pengeluaran'}
                            </span>
                          </td>
                          <td className={`px-6 py-3.5 text-right font-semibold ${t.type === 'masuk' ? 'text-emerald-400' : 'text-rose-400'}`}>
                            {t.type === 'masuk' ? '+' : '-'}{formatRupiah(t.amount)}
                          </td>
                          <td className="px-6 py-3.5 text-center">
                            <button onClick={() => deleteTx(t.id)} className="text-xs text-rose-400 hover:underline">Hapus</button>
                          </td>
                        </tr>
                      ))}
                      {filteredTx.length === 0 && (
                        <tr><td colSpan="5" className="px-6 py-8 text-center text-slate-500">Belum ada transaksi di proyek ini.</td></tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </>
            ) : (
              <div className="bg-slate-800/40 p-12 rounded-xl text-center border border-slate-700 text-slate-400">
                Silakan pilih atau tambah proyek baru untuk memulai.
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
